# FastAPI + Caddy (HTTPS tự động bằng Let's Encrypt), mục 13.3.
#
#   cp deploy/.env.example deploy/.env    # điền CAAR_API_KEY, CAAR_DOMAIN
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   curl https://<CAAR_DOMAIN>/health
services:
  api:
    build: ../cloud-service
    restart: unless-stopped
    environment:
      CAAR_API_KEY: ${CAAR_API_KEY:?set CAAR_API_KEY in deploy/.env}
    volumes:
      - caar-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CAAR_DOMAIN: ${CAAR_DOMAIN:?set CAAR_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caar-data:
  caddy-data:
  caddy-config:

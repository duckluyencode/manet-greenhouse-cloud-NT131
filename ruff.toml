# Cấu hình ruff cho cả repo. Ghi rõ bộ luật để CI không đổi kết quả khi ruff
# ra phiên bản mới với bộ luật mặc định khác (phiên bản pin trong CI workflow).
target-version = "py311"
line-length = 110

[lint]
# E4/E7/E9/F: bộ mặc định cũ của ruff; I: thứ tự import.
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
# app/ của cloud-service và các module trong scripts/ là code của repo.
known-first-party = ["app", "caar_stats", "fit_channel", "gen_waypoints"]
